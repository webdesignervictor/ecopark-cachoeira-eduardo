<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2118" />

    <!--
      SEO. %VITE_SITE_URL% vem do arquivo .env (ou das variáveis do projeto no Vercel):
      é o endereço do site sem barra no final, ex.: https://evento.cachoeiradoesmeril.com.br
      Sem ele, as tags ficam com caminho relativo e a prévia no WhatsApp pode não mostrar a imagem.
      Data, preço e local abaixo precisam bater com src/dados/evento.ts.
    -->
    <title>Rope Jump na Cachoeira do Esmeril · 10/10 · Patrocínio Paulista-SP</title>
    <meta name="description" content="Salte de corda na Cachoeira do Esmeril, em Patrocínio Paulista-SP, no sábado 10 de outubro. Rope Jump, rede suspensa, trilha, camping e restaurante. Vagas limitadas por turno." />
    <link rel="canonical" href="%VITE_SITE_URL%/" vite-ignore />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Ícones -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Prévia ao compartilhar (WhatsApp, Instagram, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Cachoeira do Esmeril" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Rope Jump na Cachoeira do Esmeril · Sábado, 10 de outubro" />
    <meta property="og:description" content="Salto de corda, cachoeira e trilha em Patrocínio Paulista-SP. Vagas limitadas por turno — reserve pelo WhatsApp." />
    <meta property="og:image" content="%VITE_SITE_URL%/imagens/compartilhar.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pessoa saltando de corda ao lado da Cachoeira do Esmeril" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rope Jump na Cachoeira do Esmeril · Sábado, 10 de outubro" />
    <meta name="twitter:description" content="Salto de corda, cachoeira e trilha em Patrocínio Paulista-SP. Vagas limitadas por turno." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/imagens/compartilhar.jpg" />

    <!-- Dados estruturados: permite ao Google mostrar o evento com data, local e preço na busca -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "Rope Jump na Cachoeira do Esmeril",
        "description": "Salto de corda na Cachoeira do Esmeril, com trilha, rede suspensa, visita à Cachoeira da Escondida, passeio de 4x4, camping e restaurante no local. Dois turnos, vagas limitadas.",
        "startDate": "2026-10-10T09:00:00-03:00",
        "endDate": "2026-10-10T16:00:00-03:00",
        "eventStatus": "https://schema.org/EventScheduled",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "image": ["%VITE_SITE_URL%/imagens/compartilhar.jpg", "%VITE_SITE_URL%/imagens/fotos/rope-jump-salto.jpg"],
        "location": {
          "@type": "Place",
          "name": "Cachoeira do Esmeril · Camping Vale dos Sonhos",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Cachoeira do Esmeril",
            "addressLocality": "Patrocínio Paulista",
            "addressRegion": "SP",
            "postalCode": "14415-000",
            "addressCountry": "BR"
          },
          "geo": { "@type": "GeoCoordinates", "latitude": -20.8346588, "longitude": -47.3140229 }
        },
        "offers": {
          "@type": "Offer",
          "name": "Rope Jump",
          "price": "200",
          "priceCurrency": "BRL",
          "availability": "https://schema.org/LimitedAvailability",
          "url": "%VITE_SITE_URL%/"
        },
        "organizer": {
          "@type": "Organization",
          "name": "Cachoeira do Esmeril · Camping Vale dos Sonhos",
          "url": "%VITE_SITE_URL%/"
        }
      }
    </script>

    <!-- Fontes servidas pelo próprio site (sem ida ao Google) e a foto da hero, que é o que aparece primeiro. -->
    <link rel="preload" href="/fontes/figtree.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fontes/instrument-serif.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/imagens/topo.jpg" as="image" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Pixel do Meta para quem está sem JavaScript (com JS, ele carrega por src/dados/pixel.ts). -->
    <noscript>
      <img height="1" width="1" style="display: none" alt=""
        src="https://www.facebook.com/tr?id=1570101697673660&ev=PageView&noscript=1" />
    </noscript>
    <noscript>
      Rope Jump na Cachoeira do Esmeril, em Patrocínio Paulista-SP. Sábado, 10 de outubro, dois turnos (9h às 11h45 e
      13h às 16h), vagas limitadas. Ative o JavaScript para ver a página completa e reservar pelo WhatsApp.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
